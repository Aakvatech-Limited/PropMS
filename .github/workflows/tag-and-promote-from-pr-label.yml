name: Tag and promote from PR label

on:
  pull_request_target:
    types:
      - closed
      - labeled

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: tag-and-promote-${{ github.repository }}
  cancel-in-progress: false

jobs:
  tag-and-promote:
    if: >
      github.event.pull_request.merged == true &&
      (
        github.event.action == 'closed' ||
        (
          github.event.action == 'labeled' &&
          startsWith(github.event.label.name, 'promote/')
        )
      )
    runs-on: ubuntu-latest

    steps:
      - name: Confirm reviewed backport target
        id: target
        uses: actions/github-script@v8
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            const targetBranch = pullRequest.base.ref;
            const expectedLabel = "promote/" + targetBranch;
            const labels = pullRequest.labels.map(({ name }) => name);
            const match = targetBranch.match(/^version-(\d+)(?:-hotfix)?$/);

            if (!match) {
              const promotionRequested = labels.some(name => name.startsWith("promote/"));
              if (promotionRequested) {
                core.setFailed(
                  "Release promotion blocked: target branch '" + targetBranch +
                  "' does not identify a Frappe major version. " +
                  "Use version-N or version-N-hotfix (for example, version-15-hotfix). " +
                  "No version or tag was changed."
                );
                return;
              }
              core.info("The PR target is not a version maintenance branch and no promotion was requested. Skipping release.");
              core.setOutput("should_release", "false");
              return;
            }

            if (!pullRequest.title.startsWith("[Backport " + targetBranch + "]")) {
              core.info("The PR was not created by the reviewed backport workflow. Skipping release.");
              core.setOutput("should_release", "false");
              return;
            }

            if (!labels.includes(expectedLabel)) {
              core.info("Missing " + expectedLabel + ". Skipping release.");
              core.setOutput("should_release", "false");
              return;
            }

            core.setOutput("should_release", "true");
            core.setOutput("target_branch", targetBranch);
            core.setOutput("expected_major", match[1]);

      - name: Checkout release branch
        if: steps.target.outputs.should_release == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.target.outputs.target_branch }}
          fetch-depth: 0

      - name: Detect Frappe app package
        if: steps.target.outputs.should_release == 'true'
        id: app
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t hooks < <(find . -mindepth 2 -maxdepth 3 -type f -name hooks.py -not -path './.git/*' -print)
          if [ "${#hooks[@]}" -ne 1 ]; then
            echo "Expected exactly one Frappe hooks.py, found ${#hooks[@]}" >&2
            printf '%s\n' "${hooks[@]}" >&2
            exit 1
          fi
          app_dir="$(dirname "${hooks[0]}")"
          init_file="$app_dir/__init__.py"
          test -f "$init_file" || { echo "Missing $init_file" >&2; exit 1; }
          echo "init_file=${init_file#./}" >> "$GITHUB_OUTPUT"

      - name: Check for an existing release
        if: steps.target.outputs.should_release == 'true'
        id: existing
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TARGET_BRANCH: ${{ steps.target.outputs.target_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" --tags --force

          while IFS=$'\t' read -r commit subject trailer; do
            if [[ "$subject" =~ ^chore\(release\):\ Bumped\ to\ Version\ ([0-9]+\.[0-9]+\.[0-9]+)$ ]] &&
              [[ "$trailer" == "Promoted-PR: #${PR_NUMBER}" ]]; then
              tag="v${BASH_REMATCH[1]}"
              echo "existing=true" >> "$GITHUB_OUTPUT"
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
              echo "commit=$commit" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done < <(git log "origin/$TARGET_BRANCH" --format='%H%x09%s%x09%b' --grep='chore(release):')

          echo "existing=false" >> "$GITHUB_OUTPUT"

      - name: Collect unreleased commits
        if: steps.target.outputs.should_release == 'true'
        id: changes
        env:
          EXPECTED_MAJOR: ${{ steps.target.outputs.expected_major }}
          RELEASE_HEAD: ${{ steps.existing.outputs.existing == 'true' && format('{0}^', steps.existing.outputs.commit) || format('origin/{0}', steps.target.outputs.target_branch) }}
          TARGET_BRANCH: ${{ steps.target.outputs.target_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" --tags --force

          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          release_head = os.environ["RELEASE_HEAD"]
          expected_major = os.environ["EXPECTED_MAJOR"]
          version_pattern = re.compile(rf"^v{re.escape(expected_major)}\.(\d+)\.(\d+)$")

          tags = subprocess.check_output(
              ("git", "tag", "--merged", release_head, "--list", f"v{expected_major}.*.*"),
              text=True,
          ).splitlines()
          release_tags = [tag for tag in tags if version_pattern.fullmatch(tag)]
          base_tag = max(
              release_tags,
              key=lambda tag: tuple(map(int, version_pattern.fullmatch(tag).groups())),
              default=None,
          )
          commit_range = f"{base_tag}..{release_head}" if base_tag else release_head
          raw_commits = subprocess.check_output(
              ("git", "log", "--no-merges", "--reverse", "--format=%H%x00%s%x00%b%x00", commit_range),
          ).split(b"\x00")

          commits = []
          for index in range(0, len(raw_commits) - 1, 3):
              sha, subject, body = raw_commits[index : index + 3]
              commits.append(
                  {
                      "sha": sha.decode("utf-8"),
                      "subject": subject.decode("utf-8"),
                      "body": body.decode("utf-8"),
                  }
              )

          if not commits:
              raise SystemExit(f"No unreleased commits found in {commit_range}")

          feature_commit = next(
              (
                  commit
                  for commit in commits
                  if re.match(r"^feat(?:\([^)]+\))?!?:", commit["subject"], re.IGNORECASE)
              ),
              None,
          )
          kind = "minor" if feature_commit else "patch"
          Path(".release-commits.json").write_text(
              json.dumps(commits, ensure_ascii=False), encoding="utf-8"
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"base_tag={base_tag or ''}\n")
              output.write(f"count={len(commits)}\n")
              output.write(f"kind={kind}\n")
          print(f"Found {len(commits)} unreleased commits since {base_tag or 'the start of the branch'}.")
          print(f"Using a {kind} release.")
          PY

      - name: Calculate release version
        if: >
          steps.target.outputs.should_release == 'true' &&
          steps.existing.outputs.existing == 'false'
        id: release
        env:
          EXPECTED_MAJOR: ${{ steps.target.outputs.expected_major }}
          INCREMENT: ${{ steps.changes.outputs.kind }}
          APP_INIT: ${{ steps.app.outputs.init_file }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          version_pattern = re.compile(r"^v(\d+)\.(\d+)\.(\d+)$")
          init_pattern = re.compile(r'(?m)^__version__\s*=\s*["\'](\d+)\.(\d+)\.(\d+)["\']$')
          init_file = Path(os.environ["APP_INIT"])
          content = init_file.read_text(encoding="utf-8")
          match = init_pattern.search(content)
          if not match:
              raise SystemExit(f"Could not read a semantic __version__ from {init_file}")

          expected_major = int(os.environ["EXPECTED_MAJOR"])
          declared_version = tuple(map(int, match.groups()))
          if declared_version[0] != expected_major:
              raise SystemExit(
                  f"Target branch expects major {expected_major}, but declared version is "
                  f"{'.'.join(map(str, declared_version))}."
              )

          tags = subprocess.check_output(("git", "tag", "--list", "v*"), text=True).splitlines()
          versions = []
          for tag in tags:
              parsed = version_pattern.fullmatch(tag)
              if parsed and int(parsed.group(1)) == expected_major:
                  versions.append(tuple(map(int, parsed.groups())))

          current = max(versions, default=declared_version)
          if os.environ["INCREMENT"] == "minor":
              next_version = (current[0], current[1] + 1, 0)
          else:
              next_version = (current[0], current[1], current[2] + 1)

          version = ".".join(map(str, next_version))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"tag=v{version}\n")
          PY

      - name: Create release commit
        if: >
          steps.target.outputs.should_release == 'true' &&
          steps.existing.outputs.existing == 'false'
        id: release_commit
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TARGET_BRANCH: ${{ steps.target.outputs.target_branch }}
          VERSION: ${{ steps.release.outputs.version }}
          APP_INIT: ${{ steps.app.outputs.init_file }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$TARGET_BRANCH"
          git checkout --detach "origin/$TARGET_BRANCH"

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          init_file = Path(os.environ["APP_INIT"])
          content = init_file.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'(?m)^__version__\s*=\s*["\'][^"\'\r\n]+["\']$',
              f'__version__ = "{os.environ["VERSION"]}"',
              content,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not update exactly one __version__ assignment")
          init_file.write_text(updated, encoding="utf-8")
          PY

          git diff --check
          git add "$APP_INIT"
          git commit -m "chore(release): Bumped to Version $VERSION" -m "Promoted-PR: #$PR_NUMBER"
          git push origin "HEAD:$TARGET_BRANCH"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create and push version tag
        if: >
          steps.target.outputs.should_release == 'true' &&
          steps.existing.outputs.existing == 'false'
        env:
          RELEASE_COMMIT: ${{ steps.release_commit.outputs.commit }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            tag_commit="$(git rev-list -n 1 "$TAG")"
            [ "$tag_commit" = "$RELEASE_COMMIT" ] || exit 1
            exit 0
          fi
          git tag -a "$TAG" "$RELEASE_COMMIT" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create categorized GitHub release notes
        if: steps.target.outputs.should_release == 'true'
        uses: actions/github-script@v8
        env:
          BASE_TAG: ${{ steps.changes.outputs.base_tag }}
          TAG_NAME: ${{ steps.existing.outputs.tag || steps.release.outputs.tag }}
          TARGET_BRANCH: ${{ steps.target.outputs.target_branch }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tagName = process.env.TAG_NAME;
            const commits = require("fs").readFileSync(".release-commits.json", "utf8");
            const unreleasedCommits = JSON.parse(commits);
            const pullRequestReference = async (sha) => {
              const commitUrl = "https://github.com/" + owner + "/" + repo + "/commit/" + sha;

              try {
                const pullRequests = await github.paginate(
                  github.rest.repos.listPullRequestsAssociatedWithCommit,
                  { owner, repo, commit_sha: sha, per_page: 100 }
                );
                const pullRequest =
                  pullRequests.find(
                    ({ merged_at, base }) =>
                      merged_at && base.ref !== process.env.TARGET_BRANCH
                  ) ??
                  pullRequests.find(({ merged_at }) => merged_at) ??
                  pullRequests[0];

                if (pullRequest) {
                  return "([#" + pullRequest.number + "](" + pullRequest.html_url + "))";
                }
              } catch (error) {
                core.warning(
                  "Could not find a pull request for " + sha.slice(0, 7) + ": " + error.message
                );
              }

              return "([" + sha.slice(0, 7) + "](" + commitUrl + "))";
            };
            const categories = [
              ["Breaking Changes", []],
              ["New Features", []],
              ["Bug Fixes", []],
              ["Performance Improvements", []],
              ["Other Changes", []],
            ];
            const excluded = new Set(["build", "chore", "ci", "docs", "refactor", "style", "test"]);

            for (const { sha, subject, body } of unreleasedCommits) {
              const match = subject.match(/^(\w+)(?:\([^)]+\))?(!)?:\s+(.+)$/i);
              const type = match?.[1]?.toLowerCase();
              const summary = match?.[3] || subject;
              const breaking = Boolean(match?.[2]) || /BREAKING CHANGE:/im.test(body);
              const category = breaking ? 0
                : type === "feat" ? 1
                : type === "fix" ? 2
                : type === "perf" ? 3
                : excluded.has(type) ? null : 4;
              if (category !== null) {
                const originalCommit = body.match(
                  /\(cherry picked from commit ([0-9a-f]{40})\)/i
                )?.[1];
                const reference = await pullRequestReference(originalCommit || sha);
                categories[category][1].push("- " + summary + " " + reference);
              }
            }

            const sections = categories
              .filter(([, entries]) => entries.length)
              .map(([title, entries]) => "## " + title + "\n\n" + entries.join("\n"));
            const body = [
              "Changes since " + (process.env.BASE_TAG || "the start of the branch") + ".",
              sections.length ? sections.join("\n\n") : "No user-facing changes.",
            ].join("\n\n");
            const releaseData = { name: "Release " + tagName, body, draft: false, prerelease: false };

            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag: tagName });
              await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, ...releaseData });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.repos.createRelease({ owner, repo, tag_name: tagName, ...releaseData });
            }

      - name: Comment on the reviewed backport PR
        if: >
          steps.target.outputs.should_release == 'true' &&
          steps.existing.outputs.existing == 'false'
        uses: actions/github-script@v8
        env:
          TAG_NAME: ${{ steps.release.outputs.tag }}
          TARGET_BRANCH: ${{ steps.target.outputs.target_branch }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tagName = process.env.TAG_NAME;
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: context.payload.pull_request.number,
              body: [
                "## Release created",
                "",
                "- Tag: " + tagName,
                "- Target branch: " + process.env.TARGET_BRANCH,
                "- Release commit: chore(release): Bumped to Version " + tagName.slice(1),
                "- Release: https://github.com/" + owner + "/" + repo + "/releases/tag/" + tagName,
              ].join("\n"),
            });
